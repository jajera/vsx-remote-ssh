name: Auto-merge Dependabot PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    uses: actionsforge/actions/.github/workflows/dependabot-auto-merge.yml@main
    # Explicit map so Dependabot-triggered runs pass Dependabot secrets
    # (secrets: inherit only forwards Actions secrets).
    secrets:
      DEPENDABOT_MERGE_APP_ID: ${{ secrets.DEPENDABOT_MERGE_APP_ID }}
      DEPENDABOT_MERGE_APP_PRIVATE_KEY: ${{ secrets.DEPENDABOT_MERGE_APP_PRIVATE_KEY }}
